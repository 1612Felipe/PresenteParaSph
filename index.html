<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Sophia ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts"></div>

    <main class="container">

        <div class="heart">❤️</div>

        <p class="small-text">
            UMA SURPRESA PARA VOCÊ...
        </p>

        <h1>Oi, Sophia ❤️</h1>

        <p class="message">
            Eu preparei uma coisa muito especial para você.
            Mas ainda não está na hora de abrir...
        </p>

        <div class="line"></div>

        <h2>
            Sua surpresa será desbloqueada em:
        </h2>

        <div class="countdown">

            <div>
                <span id="days">00</span>
                <small>dias</small>
            </div>

            <div>
                <span id="hours">00</span>
                <small>horas</small>
            </div>

            <div>
                <span id="minutes">00</span>
                <small>minutos</small>
            </div>

            <div>
                <span id="seconds">00</span>
                <small>segundos</small>
            </div>

        </div>

        <p class="wait">
            Espera só mais um pouquinho, princesa... ❤️
        </p>

        <div class="lock">🔒</div>

    </main>

    <script src="script.js?v=3"></script>

</body>
</html>
