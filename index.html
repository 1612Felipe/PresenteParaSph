<head>
    <meta charset="UTF-8">

</head>

    <div class="hearts"></div>

                <small>horas</small>
            </div>

            <div>
                <span id="minutes">00</span>
                <small>minutos</small>
            </div>

            <div>
                <span id="seconds">00</span>
                <small>segundos</small>
            </div>
        </div>

        <p class="wait">
